<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RandoPal 網頁版 V0.56 · 發布與安裝指南</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#173a68;background:#f3f9ff}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}a{color:#267ac4}.shell{max-width:1180px;margin:auto;padding:22px}.hero{background:linear-gradient(115deg,#e1f4ff,#f9fcff);border:1px solid #cae7fa;border-radius:24px;padding:27px 30px;display:flex;align-items:center;gap:20px}.hero img{width:96px;height:96px;object-fit:contain}.hero h1{margin:4px 0 5px;font-size:clamp(28px,4vw,42px)}.hero p{margin:0;color:#547393}.tag{display:inline-block;border-radius:100px;background:#d0ebff;color:#1674b7;padding:5px 11px;font-weight:700;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.top h2{margin:0;font-size:18px}.lang{border:1px solid #b8d7ee;background:#fff;border-radius:10px;padding:9px 12px;color:#173a68;cursor:pointer}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 20px}.tabs button{border:1px solid #cbe2f4;background:#fff;color:#47749f;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:700}.tabs button[aria-selected="true"]{background:#368fdf;border-color:#368fdf;color:white}.panel{background:white;border:1px solid #d8e8f5;border-radius:20px;padding:25px 30px;box-shadow:0 8px 24px #214e770a}.panel h2{font-size:25px;margin:0 0 8px}.panel h3{margin:26px 0 9px;font-size:18px}.panel p,.panel li{line-height:1.75;color:#405e7d}.panel ol,.panel ul{padding-left:23px}.panel li{margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:18px 0}.card{border:1px solid #d7e8f4;background:#f8fcff;border-radius:14px;padding:16px}.card strong{display:block;margin-bottom:6px}.card p{font-size:14px;margin:0}.callout{background:#eaf6ff;border-left:4px solid #4b9de2;border-radius:9px;padding:13px 16px;margin:17px 0;color:#315778}.warn{background:#fff8e9;border-left-color:#e8a737}.button{display:inline-block;text-decoration:none;background:#368fdf;color:white;border-radius:10px;padding:10px 14px;font-weight:700;margin:5px 8px 5px 0}.button.secondary{background:#e5f3ff;color:#2674b6}.file{font-family:ui-monospace,SFMono-Regular,monospace;font-size:.9em;background:#eaf3fa;border-radius:5px;padding:2px 5px;overflow-wrap:anywhere}.steps{counter-reset:steps;list-style:none;padding:0!important}.steps li{counter-increment:steps;position:relative;padding:13px 14px 13px 49px;background:#f8fbfe;border:1px solid #e2edf5;border-radius:11px;margin:9px 0}.steps li:before{content:counter(steps);position:absolute;left:13px;top:13px;width:25px;height:25px;border-radius:50%;background:#c8e7ff;color:#1268a9;display:grid;place-items:center;font-weight:800}.status{font-size:13px;color:#537ca0;margin-top:20px}.check{display:flex;gap:10px;align-items:start;margin:9px 0;color:#405e7d}.check input{margin-top:5px;accent-color:#368fdf}.foot{font-size:13px;color:#7290a9;margin:20px 2px 30px}code{white-space:normal}@media(max-width:650px){.shell{padding:12px}.hero{padding:18px;gap:12px}.hero img{width:68px;height:68px}.panel{padding:18px}.tabs button{padding:9px 10px}}
  </style>
</head>
<body>
<div id="app"></div>

</body>
</html>
