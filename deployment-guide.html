\u958B\u8A2D Partner Center \u5F8C\u63D0\u4EA4 Edge\u3002</li><li>\u7528\u81EA\u5DF1\u7684 Apple Team \u7C3D\u7F72 Safari Extension \u8207\u539F\u751F iOS App\uFF0C\u518D\u505A\u5BE6\u6A5F\u9A57\u8B49\u53CA App Store Connect \u9001\u5BE9\u3002</li></ol>'},en:{hero:"Deployment guide",sub:"Edit, test, package, install, and publish from one place.",nav:"Choose a platform",footer:"Open this HTML file directly. Keep its relative location to the release files for downloads; official documentation requires internet access.",tabs:{start:"Overview",edit:"Edit & build",chrome:"Chrome",edge:"Edge",safari:"Safari",ios:"iPhone / iPad",check:"Checklist"},start:'<h2>Choose how to use RandoPal</h2><p>The same web code powers all targets. Desktop browsers use extensions; Apple devices can use a Safari Web App, Safari extension, or native iOS app. Use the language toggle at the top to switch between Traditional Chinese and English. The highlighted side shows the current language, and the choice is saved locally.</p><div class="grid"><div class="card"><strong>Chrome / Edge desktop</strong><p>Manifest V3 ZIPs are ready for local testing and store submission.</p></div><div class="card"><strong>Safari</strong><p>Open the site directly or build the converted Safari Web Extension Xcode project.</p></div><div class="card"><strong>iPhone / iPad</strong><p>Install the web app from Safari or build the shared iOS native project.</p></div></div><div class="callout">Desktop Chrome extensions cannot be installed in Chrome on iPhone or iPad. Use the Safari routes or native app there.</div><h3>Build status</h3><ul><li>Chrome and Edge ZIPs: ready.</li><li>Safari macOS and iOS extension project: generated; unsigned macOS build passed.</li><li>Native iOS project: unsigned simulator SDK build passed; device behavior still needs testing.</li><li>Web App: offline cache included; an HTTPS host is needed for phone installation.</li></ul>',edit:'<h2>Edit once, then rebuild</h2><ol class="steps"><li>Edit <span class="file">index.html</span>, <span class="file">styles.css</span>, <span class="file">src/</span>, and <span class="file">icons/</span> in the project root. App translations are in <span class="file">src/i18n.js</span>; extension store name and description translations are in <span class="file">_locales/</span>.</li><li>Edit <span class="file">manifest.json</span> for extension name, version, description, or permissions. Increase the version for each store update.</li><li>Run <span class="file">npm test</span>, then <span class="file">npm run package:all</span>. Outputs are under <span class="file">release/v0.50/</span>.</li><li>The package:all script regenerates the Safari Xcode project and aligns its version; then verify it in Xcode.</li><li>Test import, pick, order, group, sound, projection, and local storage on each target.</li></ol><div class="callout warn">The build script is pinned to V0.50. For the next version, update versions in package.json, manifest.json, the packaging script, and cache name.</div>',chrome:`<h2>Chrome Web Store</h2><a class="button" href="${zt.chrome}" download>Download Chrome ZIP</a><a class="button secondary" href="${Ot}chrome/STORE-LISTING.md">Listing copy and assets</a><a class="button secondary" href="${Ot}chrome/privacy-policy.html">Privacy policy preview</a><h3>Local test</h3><ol class="steps"><li>Open <span class="file">chrome://extensions</span>.</li><li>Turn on Developer mode and choose Load unpacked.</li><li>Select <span class="file">release/v0.50/chrome/extension</span> and test from the toolbar.</li></ol><h3>Publish</h3><ol class="steps"><li>Sign in to the <a href="https://chrome.google.com/webstore/devconsole" target="_blank" rel="noopener">Developer Dashboard</a> and create an item.</li><li>Upload <span class="file">RandoPal-chrome-v0.50.zip</span> with manifest.json at the ZIP root.</li><li>Use the ready-to-paste Chinese and English copy in <span class="file">chrome/STORE-LISTING.md</span>; upload the listed screenshots and complete privacy information. The live privacy policy URL is https://randopal-privacy-policy.cguaacsb.chatgpt.site/</li><li>Explain the storage permission, preview, and submit for review.</li></ol><p><a href="${Ta.chrome}" target="_blank" rel="noopener">Official Chrome guide \u2197</a></p>`,edge:`<h2>Microsoft Edge Add-ons</h2><a class="button" href="${zt.edge}" download>Download Edge ZIP</a><h3>Local test</h3><ol class="steps"><li>Open <span class="file">edge://extensions</span> and turn on Developer mode.</li><li>Choose Load unpacked and select <span class="file">release/v0.50/edge/extension</span>.</li><li>Test import, random results, and export.</li></ol><h3>Publish later</h3><ol class="steps"><li>Register for the Edge developer program in Microsoft Partner Center.</li><li>Create an extension and upload the ZIP.</li><li>Complete listing, images, privacy, availability, and submit for review.</li></ol><p><a href="${Ta.edge}" target="_blank" rel="noopener">Official Edge guide \u2197</a></p>`,safari:`<h2>Safari website and extension</h2><h3>A. Website</h3><p>Open the hosted RandoPal URL in Safari. The Mac test URL is <span class="file">http://localhost:4173/index.html</span>. After HTTPS deployment, Safari on Mac can use File \u2192 Add to Dock.</p><h3>B. Safari Web Extension</h3><a class="button" href="${zt.safari}" download>Download Safari Xcode source</a><ol class="steps"><li>Open <span class="file">release/v0.50/safari/RandoPal/RandoPal.xcodeproj</span> in Xcode.</li><li>Set your Team and a unique bundle identifier in place of <span class="file">com.randopal.safari</span>.</li><li>Build the macOS or iOS scheme and install the containing app.</li><li>Enable RandoPal in Safari Extensions settings.</li><li>Join the Apple Developer Program and submit through App Store Connect for public distribution.</li></ol><h3>Regenerate after code changes</h3><p class="file">npm run package:all</p><div class="callout warn">The extension is installed through a containing app. Compilation does not replace real Safari device testing.</div><p><a href="${Ta.safari}" target="_blank" rel="noopener">Official Apple guide \u2197</a></p>`,ios:`<h2>iPhone and iPad</h2><p>The native project targets both iPhone and iPad. The web app also works on both.</p><a class="button" href="${zt.web}" download>Download Web App files</a><a class="button secondary" href="${zt.ios}" download>Download native iOS source</a><h3>A. Safari Home Screen Web App</h3><ol class="steps"><li>Deploy <span class="file">ios/webapp/</span> to an HTTPS website while preserving relative paths.</li><li>Open the URL in Safari on iPhone or iPad; tap Share \u2192 Add to Home Screen.</li><li>Launch from the Home Screen. The first visit needs network so offline assets can cache.</li></ol><div class="callout">The Mac's localhost URL is not a phone installation URL.</div><h3>B. Native app</h3><ol class="steps"><li>Open <span class="file">release/v0.50/ios/native/RandoPal.xcodeproj</span> in Xcode.</li><li>Set your own bundle identifier and Team, and connect an iPhone or iPad.</li><li>Select the device and Run. App Store or TestFlight distribution requires Apple Developer Program membership.</li></ol><p><a href="${Ta.apple}" target="_blank" rel="noopener">Official Apple Home Screen guide \u2197</a></p>`,check:'<h2>Prelaunch checklist</h2><p>Checklist state is saved in this browser.</p><div id="checks"></div><h3>Suggested order</h3><ol><li>Test Chrome / Edge locally and Safari web on iPhone / iPad.</li><li>Finalize name, icon, privacy statement, and store images.</li><li>Submit Chrome, then Edge after Partner Center registration.</li><li>Sign Apple targets with your Team, test on real devices, then submit through App Store Connect.</li></ol>'}},mh={zh:["\u78BA\u8A8D\u6838\u5FC3\u529F\u80FD\u5728\u76EE\u6A19\u88DD\u7F6E\u80FD\u4F7F\u7528","\u78BA\u8A8D\u7248\u672C\u865F\u8207\u5716\u793A","\u6AA2\u67E5\u5546\u5E97\u622A\u5716\u8207\u6587\u5B57","\u6AA2\u67E5\u540D\u55AE\u8CC7\u6599\u7684\
